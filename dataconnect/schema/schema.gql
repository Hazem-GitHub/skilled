# 1. User Table
type User @table(key: "clerkId") {
    clerkId: String! @unique
    email: String! @unique
    username: String
    imageUrl: String
}

# 2. Skill Table
type Skill @table {
    id: UUID! @default(expr: "uuidV4()")
    # Relationship
    author: User!
    # Content
    title: String!
    description: String!
    category: String!
    tags: [String!]!
    upvotes: Int! @default(value: 0)
    commentCount: Int! @default(value: 0)
    # Technical configuration
    installCommand: String!
    promptConfig: String!
    usageExample: String!
    # Metadata
    createdAt: Timestamp! @default(expr: "request.time")
}